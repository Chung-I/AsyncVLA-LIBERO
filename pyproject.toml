[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "OmniVLA"
authors = [
    {name = "Noriaki Hirose"},
    {name = "Catherine Glossop"},
    {name = "Dhruv Shah"},
    {name = "Sergey Levine"},    
]
description = "AsyncVLA: An Asynchronous VLA for Fast and Robust Navigation on the Edge"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["vision-language-action model", "vision-based navigation", "robot learning", "foundation model"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=0.25.0",
    "draccus==0.8.0",
    "einops",
    # "flash_attn==2.5.5",      # Here for documentation -- install *AFTER* editable install (follow README)
    "huggingface_hub==0.29.1",
    "json-numpy",
    "jsonlines",
    "matplotlib",
    "peft==0.11.1",
    "protobuf",
    "rich",
    "sentencepiece==0.1.99",
    "timm==0.9.10",
    # Pinned <0.20 for the OpenVLA-OFT transformers fork (4.40.1). See transformers note below.
    "tokenizers>=0.19.1,<0.20",
    # NOTE (Phase-1 env, RTX 5090 / Blackwell sm_120): the upstream pins below (torch==2.2.0,
    # torchvision==0.17.0, torchaudio==2.2.0) cannot drive a Blackwell GPU. Relaxed to floors so
    # `pip install -e .` does not clobber the Blackwell-capable torch==2.11.0+cu128 installed
    # separately from https://download.pytorch.org/whl/cu128. See docs/superpowers/notes/phase1-env.md.
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    # REQUIRED: the moojink/transformers-openvla-oft fork (transformers 4.40.1) implements the
    # BIDIRECTIONAL (non-causal) attention over action tokens that OpenVLA-OFT parallel decoding
    # was trained with. Stock transformers uses causal attention -> train/inference mismatch ->
    # depressed LIBERO SR (measured: 0.61 with stock 4.47.1 vs ~0.9+ with the fork). On this
    # Blackwell/torch-2.11 box the fork's own deps don't resolve, so install it WITHOUT deps:
    #   uv pip install --python .venv/bin/python --no-deps --reinstall-package transformers \
    #     "transformers @ git+https://github.com/moojink/transformers-openvla-oft.git"
    #   uv pip install --python .venv/bin/python "tokenizers>=0.19.1,<0.20"
    # See docs/superpowers/notes/phase1-env.md.
    "transformers @ git+https://github.com/moojink/transformers-openvla-oft.git",
    "wandb",
    # NOTE: tensorflow==2.15.0 / tensorflow_graphics==2021.12.3 / dlimp (git) are RLDS/training-only
    # deps with no compatible wheels for this Python 3.10 + numpy 2.x env; relaxed/deferred, see notes.
    "tensorflow>=2.15.0",
    "tensorflow_datasets>=4.9.3",
    # NOTE: diffusers is only referenced in a commented-out import (prismatic/models/action_heads.py);
    # newer diffusers hard-require peft>=0.15 which conflicts with the OpenVLA-OFT peft==0.11.1 pin.
    # Kept at the upstream 0.11.1 to avoid the conflict. See docs/superpowers/notes/phase1-env.md.
    "diffusers==0.11.1",
    "imageio",
    "uvicorn",
    "fastapi",
    "utm",
    "lmdb",
    "zarr",
    "datasets",
    "efficientnet_pytorch",
    "av"
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]

[project.urls]
homepage = "https://asyncvla.github.io"
repository = "https://github.com/NHirose/AsyncVLA"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["cache"]

[tool.setuptools.package-data]
"prismatic" = ["py.typed"]

[tool.black]
line-length = 121
target-version = ["py38", "py39", "py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py38"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (e.g. loads a full model checkpoint; deselect with '-m \"not slow\"')",
]
